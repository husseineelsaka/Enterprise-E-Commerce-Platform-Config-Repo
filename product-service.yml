eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

server:
  port: 8081

service:
  message: Product service loaded from Github repository

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data: 
    redis: 
      host: ${SPRING_DATA_REDIS_HOST:localhost} 
      port: ${SPRING_DATA_REDIS_PORT:6379} 
  cache: 
    type: redis 
    redis: 
      time-to-live: 300000  # 5 min TTL(milliseconds) 
      cache-null-values: false  # do not cache null responses
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

